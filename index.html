<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Sembako Mandiri</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>body{background:#f3f4f6;padding:10px;} .card{margin-bottom:15px;}</style>
</head>
<body>
<div class="container-fluid">
    <h3 class="text-center text-primary my-3">🏪 Kasir Sembako Mandiri</h3>
    <div class="row">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h5>⚙️ Input / Edit Produk</h5>
                <form id="f-produk" onsubmit="saveBarang(event)">
                    <input type="hidden" id="e-id">
                    <div class="mb-2"><label>Nama Barang</label><input type="text" id="i-nama" class="form-control form-control-sm" required></div>
                    <div class="mb-2"><label>Harga Modal</label><input type="number" id="i-modal" class="form-control form-control-sm" required></div>
                    <div class="mb-2"><label>Harga Jual</label><input type="number" id="i-harga" class="form-control form-control-sm" required></div>
                    <div class="mb-2"><label>Jumlah Stok</label><input type="number" id="i-stok" class="form-control form-control-sm" required></div>
                    <button type="submit" class="btn btn-success btn-sm w-100" id="btn-save">Simpan Barang</button>
                    <button type="button" class="btn btn-secondary btn-sm w-100 mt-1 d-none" id="btn-batal" onclick="batal()">Batal</button>
                </form>
            </div>
            <div class="card p-3 shadow-sm bg-light">
                <h6>📊 Ringkasan Keuntungan</h6>
                <div>Laba Bersih: <strong class="text-success" id="l-laba">Rp0</strong></div>
                <button class="btn btn-danger btn-sm w-100 mt-2" onclick="resetSemua()">⚠️ Kosongkan Semua Data</button>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-3 shadow-sm bg-primary text-white">
                <h5>🛒 Transaksi Baru</h5>
                <form onsubmit="keKeranjang(event)" class="row g-2">
                    <div class="col-6"><select id="p-pilih" class="form-select form-select-sm" onchange="cekHarga()" required></select></div>
                    <div class="col-3"><input type="number" id="p-qty" class="form-control form-control-sm" min="1" value="1" placeholder="Qty"></div>
                    <div class="col-3"><button type="submit" class="btn btn-light btn-sm w-100">Tambah</button></div>
                </form>
                <div class="mt-2 small">Stok: <span id="t-stok">0</span> | Harga: <span id="t-harga">Rp0</span></div>
            </div>
            <div class="card p-3 shadow-sm">
                <h6>Daftar Belanja & Stok Gudang</h6>
                <table class="table table-sm table-striped">
                    <thead><tr><th>Nama</th><th>Stok</th><th>Harga</th><th>Aksi</th></tr></thead>
                    <tbody id="t-gudang"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    let produk = JSON.parse(localStorage.getItem('k_prod')) || [];
    let riwayat = JSON.parse(localStorage.getItem('k_riw')) || 0;
    function refresh(){
        localStorage.setItem('k_prod', JSON.stringify(produk)); localStorage.setItem('k_riw', riwayat);
        const sel = document.getElementById('p-pilih'); sel.innerHTML = '<option value="">-- Pilih --</option>';
        const tb = document.getElementById('t-gudang'); tb.innerHTML = '';
        produk.forEach(p => {
            sel.innerHTML += `<option value="${p.id}">${p.nama}</option>`;
            tb.innerHTML += `<tr><td>${p.nama}</td><td><strong>${p.stok}</strong></td><td>Rp${p.harga.toLocaleString()}</td><td><button class="btn btn-warning btn-xs py-0 px-1" onclick="edit('${p.id}')">✏️</button> <button class="btn btn-danger btn-xs py-0 px-1" onclick="hapus('${p.id}')">🗑️</button></td></tr>`;
        });
        document.getElementById('l-laba').innerText = "Rp" + riwayat.toLocaleString(); cekHarga();
    }
    function saveBarang(e){
        e.preventDefault(); const id = document.getElementById('e-id').value; const nama = document.getElementById('i-nama').value; const modal = parseInt(document.getElementById('i-modal').value); const harga = parseInt(document.getElementById('i-harga').value); const stok = parseInt(document.getElementById('i-stok').value);
        if(id){ const idx = produk.findIndex(p=>p.id===id); produk[idx]={id,nama,modal,harga,stok}; batal(); }
        else{ produk.push({id:Date.now().toString(),nama,modal,harga,stok}); }
        document.getElementById('f-produk').reset(); refresh();
    }
    function edit(id){
        const p = produk.find(x=>x.id===id); if(!p) return;
        document.getElementById('e-id').value=p.id; document.getElementById('i-nama').value=p.nama; document.getElementById('i-modal').value=p.modal; document.getElementById('i-harga').value=p.harga; document.getElementById('i-stok').value=p.stok;
        document.getElementById('btn-save').innerText="Simpan Perubahan"; document.getElementById('btn-batal').classList.remove('d-none');
    }
    function batal(){ document.getElementById('e-id').value=''; document.getElementById('f-produk').reset(); document.getElementById('btn-save').innerText="Simpan Barang"; document.getElementById('btn-batal').classList.add('d-none'); }
    function hapus(id){ if(confirm("Hapus?")){ produk=produk.filter(p=>p.id!==id); refresh(); } }
    function cekHarga(){
        const id = document.getElementById('p-pilih').value; const p = produk.find(x=>x.id===id);
        document.getElementById('t-stok').innerText = p ? p.stok : 0; document.getElementById('t-harga').innerText = p ? "Rp"+p.harga.toLocaleString() : "Rp0";
    }
    function keKeranjang(e){
        e.preventDefault(); const id = document.getElementById('p-pilih').value; const qty = parseInt(document.getElementById('p-qty').value); const p = produk.find(x=>x.id===id);
        if(!p || qty > p.stok){ alert("Stok Kurang!"); return; }
        p.stok -= qty; riwayat += (p.harga - p.modal) * qty; alert("💸 Transaksi Berhasil! Laba Otomatis Tercatat.");
        document.getElementById('p-qty').value = 1; refresh();
    }
    function resetSemua(){ if(confirm("Hapus Semua Data?")){ localStorage.clear(); produk=[]; riwayat=0; refresh(); } }
    window.onload = refresh;
</script>
</body>
</html>
