<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Grosir + Laporan Keuntungan</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-responsive { max-height: 300px; overflow-y: auto; }
        .nav-tabs .nav-link { font-weight: bold; }
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="text-center mb-4">🏪 Kasir, Stok & Keuntungan Grosir</h2>

    <!-- Menu Navigasi Halaman -->
    <ul class="nav nav-tabs mb-4" id="menuTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active text-primary" id="kasir-tab" data-bs-toggle="tab" data-bs-target="#halaman-kasir" type="button" role="tab">🛒 Menu Kasir</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link text-success" id="admin-tab" data-bs-toggle="tab" data-bs-target="#halaman-admin" type="button" role="tab">⚙️ Atur Barang & Stok</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link text-danger" id="laporan-tab" data-bs-toggle="tab" data-bs-target="#halaman-laporan" type="button" role="tab">📊 Laporan Keuntungan</button>
        </li>
    </ul>

    <div class="tab-content" id="isiTab">
        
        <!-- ================= HALAMAN KASIR ================= -->
        <div class="tab-pane fade show active" id="halaman-kasir" role="tabpanel">
            <div class="row g-3">
                <div class="col-md-5">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">Transaksi Baru</div>
                        <div class="card-body">
                            <form id="form-kasir" onsubmit="tambahKeKeranjang(event)">
                                <div class="mb-3">
                                    <label class="form-label">Pilih Produk</label>
                                    <select id="pilih-produk" class="form-select" onchange="updateInfoHarga()" required>
                                        <!-- Diisi otomatis oleh JavaScript -->
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Info Stok Tersedia</label>
                                    <input type="text" id="info-stok" class="form-control fw-bold" readonly value="0">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Harga Satuan Jual</label>
                                    <input type="text" id="harga-satuan" class="form-control" readonly value="Rp0">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Jumlah Beli (Qty)</label>
                                    <input type="number" id="jumlah-beli" class="form-control" min="1" value="1" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Tambah ke Keranjang</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card shadow-sm mb-3">
                        <div class="card-header bg-secondary text-white">Keranjang Belanja</div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped align-middle">
                                    <thead>
                                        <tr>
                                            <th>Nama Barang</th>
                                            <th>Harga</th>
                                            <th>Qty</th>
                                            <th>Subtotal</th>
                                            <th>Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabel-keranjang"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body bg-light">
                            <div class="d-flex justify-content-between mb-2">
                                <h4>Total:</h4>
                                <h4 class="text-danger" id="total-belanja">Rp0</h4>
                            </div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label">Uang Tunai</label>
                                    <input type="number" id="uang-bayar" class="form-control" oninput="hitungKembalian()">
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Kembalian</label>
                                    <input type="text" id="uang-kembali" class="form-control fw-bold text-success" readonly value="Rp0">
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-danger btn-sm" onclick="resetKasir()">Kosongkan Keranjang</button>
                                <button class="btn btn-primary btn-sm flex-grow-1" onclick="selesaikanTransaksi()">Selesai & Potong Stok</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= HALAMAN ADMIN (MANAJEMEN BARANG) ================= -->
        <div class="tab-pane fade" id="halaman-admin" role="tabpanel">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <div class="card-header bg-success text-white">Form Input Produk</div>
                        <div class="card-body">
                            <form id="form-produk" onsubmit="simpanProduk(event)">
                                <input type="hidden" id="edit-id">
                                <div class="mb-3">
                                    <label class="form-label">Nama Barang Grosir</label>
                                    <input type="text" id="input-nama" class="form-control" placeholder="Contoh: Minyak Goreng 2L" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Harga Modal Belanja (Rp)</label>
                                    <input type="number" id="input-modal" class="form-control" placeholder="Contoh: 140000" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Harga Jual Toko (Rp)</label>
                                    <input type="number" id="input-harga" class="form-control" placeholder="Contoh: 165000" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Jumlah Stok</label>
                                    <input type="number" id="input-stok" class="form-control" placeholder="Contoh: 50" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100" id="btn-simpan-produk">Tambah Produk Baru</button>
                                <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btn-batal-edit" onclick="batalEdit()">Batal Edit</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-dark text-white">Daftar Stok & Master Barang</div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Nama Barang</th>
                                            <th>Harga Modal</th>
                                            <th>Harga Jual</th>
                                            <th>Stok</th>
                                            <th>Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabel-master-produk"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= HALAMAN LAPORAN KEUANGAN ================= -->
        <div class="tab-pane fade" id="halaman-laporan" role="tabpanel">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card bg-primary text-white text-center p-3 shadow-sm">
                        <h5>💰 Total Omset Pen penjualan</h5>
                        <h3 id="lap-omset">Rp0</h3>
                    </div>
