<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedai Arfaaz - Kasir & Gudang</title>
    <!-- 1. AMBIL LIBRARY SUPABASE LEWAT CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Gaya CSS Anda tetap sama seperti sebelumnya di sini */
    </style>
</head>
<body>

    <!-- HTML Tampilan Menu Input & Tabel Stok Anda Tetap Sama -->
    <!-- Pastikan id pada input & tombol sesuai dengan kode di bawah -->

    <script>
        // 2. KONFIGURASI KUNCI AKSES SUPABASE
        // Ganti teks di bawah dengan URL & Anon Key asli dari Settings > API di Supabase Anda
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; 
        
        // Inisialisasi client Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Ambil elemen HTML yang dibutuhkan (Sesuaikan ID-nya dengan HTML Anda)
        const inputNama = document.getElementById('nama_barang'); // ganti dengan id input nama Anda
        const inputModal = document.getElementById('harga_modal'); // ganti dengan id input modal Anda
        const inputJual = document.getElementById('harga_jual'); // ganti dengan id input jual Anda
        const inputStok = document.getElementById('stok'); // ganti dengan id input stok Anda
        const tombolSimpan = document.getElementById('tombol_simpan'); // ganti dengan id tombol simpan Anda
        const tabelBody = document.getElementById('tabel_produk_body'); // ganti dengan id <tbody> tabel Anda

        // ==========================================
        // 3. FUNGSI UNTUK MENAMPILKAN DATA KE TABEL HTML
        // ==========================================
        function renderTabel(daftarProduk) {
            tabelBody.innerHTML = ""; // Bersihkan tabel lama terlebih dahulu
            
            daftarProduk.forEach((produk) => {
                const baris = document.createElement('tr');
                baris.innerHTML = `
                    <td>${produk.nama_barang}</td>
                    <td><span class="badge">${produk.stok} Pcs</span></td>
                    <td>Rp ${Number(produk.harga_jual).toLocaleString('id-ID')}</td>
                    <td><button onclick="hapusProduk(${produk.id})" class="btn-hapus">🗑️</button></td>
                `;
                tabelBody.appendChild(baris);
            });
        }

        // ==========================================
        // 4. FUNGSI AMBIL DATA TERBARU DARI CLOUD
        // ==========================================
        async function ambilDataProduk() {
            const { data, error } = await supabaseClient
                .from('produk')
                .select('*')
                .order('created_at', { ascending: false }); // Produk baru tampil di paling atas

            if (error) {
                console.error("Gagal mengambil data:", error.message);
            } else {
                renderTabel(data);
            }
        }

        // ==========================================
        // 5. FUNGSI SIMPAN DATA KE SUPABASE (PENGGANTI LOCALSTORAGE)
        // ==========================================
        async function simpanProdukBaru(e) {
            e.preventDefault(); // Mencegah halaman refresh otomatis saat form disubmit

            const nama = inputNama.value;
            const modal = parseFloat(inputModal.value) || 0;
            const jual = parseFloat(inputJual.value) || 0;
            const stok = parseInt(inputStok.value) || 0;

            if (!nama) return alert("Nama barang tidak boleh kosong!");

            const { error } = await supabaseClient
                .from('produk')
                .insert([{ 
                    nama_barang: nama, 
                    harga_modal: modal, 
                    harga_jual: jual, 
                    stok: stok 
                }]);

            if (error) {
                alert("Gagal menyimpan data ke cloud: " + error.message);
            } else {
                // Kosongkan kembali form input setelah sukses dimasukkan
                inputNama.value = "";
                inputModal.value = "";
                inputJual.value = "";
                inputStok.value = "";
            }
        }

        // ==========================================
        // 6. FUNGSI HAPUS DATA DARI CLOUD
        // ==========================================
        async function hapusProduk(id) {
            if (confirm("Apakah Anda yakin ingin menghapus produk ini?")) {
                const { error } = await supabaseClient
                    .from('produk')
                    .delete()
                    .eq('id', id);

                if (error) alert("Gagal menghapus: " + error.message);
            }
        }

        // ==========================================
        // 7. AKTIFKAN FITUR REALTIME (SINKRONISASI SEKETIKA)
        // ==========================================
        function jalankanFiturRealtime() {
            supabaseClient
                .channel('perubahan-stok-kedai')
                .on(
                    'postgres_changes', 
                    { event: '*', schema: 'public', table: 'produk' }, 
                    (payload) => {
                        // Jika ada data masuk, berubah, atau dihapus di Supabase
                        // Semua HP yang membuka web ini akan langsung mengambil data terbaru secara otomatis
                        ambilDataProduk(); 
                    }
                )
                .subscribe();
        }

        // Event listener saat tombol simpan diklik
        tombolSimpan.addEventListener('click', simpanProdukBaru);

        // Jalankan fungsi utama saat website pertama kali dibuka di browser HP
        ambilDataProduk();
        jalankanFiturRealtime();
    </script>
</body>
</html>
